name: Testar e publicar jogo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código, fases e competição
        run: |
          node --check js/app.js
          node --max-old-space-size=256 tools/test.js
      - uses: actions/configure-pages@v5
      - name: Separar arquivos públicos
        run: |
          mkdir public
          cp index.html styles.css public/
          cp -r js public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
